border-radius:17px;border:3px solid #36C95F;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:16px;height:16px;border-radius:8px;background:#36C95F"></span></span>Дмитрий Лебедев</button><button type="button" style="display:flex;align-items:center;gap:24px;height:92px;padding:0 36px;border-radius:46px;border:2px solid #4A4A50;background:#2B2B2E;color:#FFFFFF;font-family:Roboto,Arial,sans-serif;font-size:28px;text-align:left"><span style="width:34px;height:34px;border-radius:17px;border:3px solid #A9A9AE;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:16px;height:16px;border-radius:8px;background:transparent"></span></span>Андрей Захаров</button></div><div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:24px"><span style="font-size:20px;color:#A9A9AE;max-width:560px">Проверьте выбор перед отправкой</span><button type="button" style="height:80px;padding:0 56px;border-radius:40px;border:0;background:#FF7A1A;color:#111113;font-family:Roboto,Arial,sans-serif;font-size:28px;font-weight:700;white-space:nowrap;">Подтвердить выбор</button></div></div></div>
